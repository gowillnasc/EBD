<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17162b">
  <title>EBD Juvenis — Bairro dos Estados 3</title>

  <style>
    :root {
      --bg: #11111f;
      --surface: #1b1b30;
      --surface-light: #24243d;
      --text: #f6f4ff;
      --muted: #bebbd2;
      --purple: #ad91ff;
      --cyan: #69e1dc;
      --pink: #ff8bb5;
      --border: rgba(255, 255, 255, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(173,145,255,.17), transparent 32rem),
        radial-gradient(ellipse at 100% 15%, rgba(105,225,220,.10), transparent 30rem),
        var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    .container {
      width: min(940px, calc(100% - 32px));
      margin-inline: auto;
    }

    header { padding: 38px 0 26px; }

    .tag {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid rgba(105,225,220,.35);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(105,225,220,.08);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .05em;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(2rem, 8vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
    }

    .index-box {
      margin: 18px 0 28px;
      padding: clamp(16px, 4vw, 24px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(173,145,255,.13), rgba(105,225,220,.06));
    }

    .index-box h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
    }

    .lesson-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .lesson-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-align: left;
      background: rgba(17,17,31,.65);
      cursor: pointer;
      transition: transform .18s, border-color .18s, background .18s;
    }

    .lesson-button:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
    }

    .lesson-button.active {
      border-color: var(--cyan);
      background: rgba(105,225,220,.1);
    }

    .lesson-number {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 13px;
      color: #17162b;
      background: var(--purple);
      font-weight: 900;
    }

    .lesson-button.active .lesson-number { background: var(--cyan); }

    .lesson-name { flex: 1; font-weight: 750; line-height: 1.3; }
    .lesson-meta { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; font-weight: 500; }
    .status { color: var(--cyan); font-size: .78rem; font-weight: 800; white-space: nowrap; }

    .content-card {
      margin: 20px 0 42px;
      padding: clamp(17px, 4vw, 30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(27,27,48,.96);
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
    }

    .lesson-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .badge {
      padding: 6px 11px;
      border-radius: 999px;
      color: #17162b;
      background: var(--cyan);
      font-size: .82rem;
      font-weight: 900;
    }

    .content-card h2 {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2rem);
      line-height: 1.2;
    }

    .verse {
      margin: 18px 0;
      padding: 15px;
      border-left: 4px solid var(--pink);
      border-radius: 0 12px 12px 0;
      background: rgba(255,139,181,.08);
    }

    .verse p { margin: 0; }
    .verse span { display: block; margin-top: 5px; color: var(--muted); }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .fact {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-light);
    }

    .fact strong {
      display: block;
      color: var(--cyan);
      font-size: .82rem;
    }

    .fact span { display: block; margin-top: 3px; }

    details {
      margin-top: 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
    }

    summary {
      position: relative;
      padding: 14px 44px 14px 16px;
      font-weight: 800;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      position: absolute;
      top: 50%;
      right: 16px;
      color: var(--cyan);
      content: "+";
      font-size: 1.35rem;
      transform: translateY(-50%);
    }

    details[open] summary::after { content: "−"; }

    .detail-body {
      padding: 0 17px 17px;
      color: #e5e3f0;
    }

    .detail-body h3 {
      margin: 19px 0 5px;
      color: var(--cyan);
      font-size: 1.02rem;
    }

    .detail-body p { margin: 9px 0; }
    .detail-body ul { padding-left: 22px; }
    .detail-body li { margin: 5px 0; }

    .highlight {
      margin: 13px 0;
      padding: 13px;
      border: 1px solid rgba(173,145,255,.25);
      border-radius: 12px;
      background: rgba(173,145,255,.08);
    }

    .question {
      margin: 0;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .question:last-child { border-bottom: 0; }

    .q-number {
      display: inline-grid;
      width: 27px;
      height: 27px;
      margin-right: 8px;
      place-items: center;
      border-radius: 50%;
      color: #17162b;
      background: var(--pink);
      font-size: .82rem;
      font-weight: 900;
    }

    .pending {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
    }

    footer {
      padding: 22px 16px 34px;
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
    }

    @media (max-width: 560px) {
      .container { width: calc(100% - 22px); }
      header { padding-top: 28px; }
      .facts { grid-template-columns: 1fr; }
      .status { font-size: .7rem; }
      .lesson-button { gap: 9px; padding: 11px; }
      .lesson-number { flex-basis: 36px; width: 36px; height: 36px; }
      .content-card { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <header class="container">
    <span class="tag">✦ ESCOLA BÍBLICA DOMINICAL · JUVENIS</span>
    <h1>EBD — Bairro dos Estados 3</h1>
    <p class="intro">
      Tema do trimestre: <strong>Espírito Santo — Deus presente em nós.</strong>
      Escolha uma lição para estudar.
    </p>
  </header>

  <main class="container">
    <section class="index-box" aria-labelledby="index-title">
      <h2 id="index-title">Índice das lições</h2>
      <ol class="lesson-list" id="lesson-list"></ol>
    </section>

    <section id="lesson-content" aria-live="polite"></section>
  </main>

  <footer>EBD — Bairro dos Estados 3 · Classe de Juvenis</footer>

  <template id="lesson-8">
    <article class="content-card">
      <div class="lesson-heading">
        <span class="badge">LIÇÃO 08 · PÁGINA 51</span>
        <h2>O Batismo no Espírito Santo</h2>
      </div>

      <div class="verse">
        <p>“E eis que sobre vós envio a promessa de meu Pai: ficai, porém, na cidade de Jerusalém, até que do alto sejais revestidos de poder.”</p>
        <span>Lucas 24.49</span>
      </div>

      <div class="facts">
        <div class="fact"><strong>LEITURA BÍBLICA</strong><span>Joel 2.28–32; Atos 1.7–8; Atos 2.16–18</span></div>
        <div class="fact"><strong>OBJETIVO</strong><span>Compreender a promessa e a atualidade do batismo no Espírito Santo.</span></div>
      </div>

      <details open>
        <summary>Objetivos da lição</summary>
        <div class="detail-body">
          <ul>
            <li>Apontar o batismo no Espírito Santo como uma promessa bíblica.</li>
            <li>Enfatizar o cumprimento das profecias de Joel e João Batista.</li>
            <li>Reafirmar a atualidade do batismo no Espírito Santo.</li>
          </ul>
        </div>
      </details>

      <details>
        <summary>Conteúdo da aula</summary>
        <div class="detail-body">
          <h3>A promessa anunciada por Joel</h3>
          <p>Joel anunciou o derramamento do Espírito sobre pessoas de diferentes idades e condições. Em Atos, Pedro relaciona essa profecia ao que aconteceu no dia de Pentecoste, quando os discípulos receberam poder e passaram a testemunhar.</p>
          <p>A lição apresenta Pentecoste como o início de uma nova época: a promessa do Espírito deixa de estar associada apenas a um grupo restrito e passa a ser anunciada a todos os que Deus chamar.</p>

          <h3>O cumprimento em Pentecoste</h3>
          <p>Os discípulos estavam reunidos quando o Espírito Santo se manifestou. Diante das reações das pessoas, Pedro explicou o acontecimento a partir das Escrituras. A lição destaca a importância de avaliar as manifestações espirituais à luz da Palavra de Deus.</p>

          <h3>O anúncio de João Batista</h3>
          <p>João Batista anunciou que Jesus batizaria com o Espírito Santo e com fogo. A lição destaca três aspectos de seu testemunho sobre Jesus: a chegada do Reino de Deus, Jesus como o Cordeiro que tira o pecado do mundo e Jesus como aquele que batiza no Espírito Santo.</p>

          <h3>Batismo em água e batismo no Espírito Santo</h3>
          <p>O batismo em água é um testemunho público da fé em Jesus e está associado ao arrependimento e à confissão dos pecados. A lição o diferencia do batismo no Espírito Santo, apresentado como a promessa anunciada por Jesus e relacionada ao revestimento de poder.</p>
          <p>Segundo a lição, essa experiência é recebida mediante a fé; cabe à pessoa buscá-la.</p>

          <h3>A atualidade da promessa</h3>
          <p>A lição ensina que a promessa do derramamento do Espírito Santo continua disponível aos que creem. Também incentiva a Igreja a permanecer firme na doutrina e a buscar a experiência com o Espírito Santo para cumprir sua missão.</p>

          <h3>Conectado com Deus</h3>
          <p>A lição cita Agnes Nevada Ozman, que, segundo o material, recebeu o batismo no Espírito Santo em 1º de janeiro de 1901, após buscá-lo em oração. A história é apresentada como exemplo de desejo e busca perseverante pela promessa.</p>

          <div class="highlight">
            <strong>Para guardar:</strong> a lição conecta a promessa de Joel, o anúncio de João Batista e o acontecimento de Pentecoste, destacando que a promessa continua atual.
          </div>
        </div>
      </details>

      <details>
        <summary>Referências para estudo</summary>
        <div class="detail-body">
          <ul>
            <li>Joel 2.28–32 — promessa do derramamento do Espírito.</li>
            <li>Atos 1.7–8 — poder para testemunhar.</li>
            <li>Atos 2.1–18 — Pentecoste e a profecia de Joel.</li>
            <li>Mateus 3.11 e Lucas 3.15–16 — anúncio de João Batista.</li>
            <li>Atos 17.10 — conferir os ensinamentos nas Escrituras.</li>
          </ul>
        </div>
      </details>

      <details>
        <summary>Para conversar em grupo</summary>
        <div class="detail-body">
          <p>A lição sugere ouvir experiências e testemunhos sobre o batismo no Espírito Santo. Em grupo, conversem sobre como estudar as Escrituras ajuda a compreender experiências e manifestações espirituais.</p>
        </div>
      </details>

      <details>
        <summary>Conclusão</summary>
        <div class="detail-body">
          <p>A lição conclui que a Igreja deve manter viva sua convicção sobre o batismo no Espírito Santo e a atualidade dos dons espirituais, buscando a capacitação necessária para cumprir sua missão.</p>
        </div>
      </details>

      <details>
        <summary>Hora da revisão · perguntas sem respostas</summary>
        <div class="detail-body">
          <p class="question"><span class="q-number">1</span>Segundo a lição, quem também falou antecipadamente sobre o batismo no Espírito Santo na vida dos seguidores de Cristo?</p>
          <p class="question"><span class="q-number">2</span>João Batista confirmou a profecia de qual profeta?</p>
          <p class="question"><span class="q-number">3</span>O que se comemorava na festa judaica chamada de Pentecoste?</p>
          <p class="question"><span class="q-number">4</span>Qual é o objetivo do batismo em água?</p>
          <p class="question"><span class="q-number">5</span>Como é recebido o batismo no Espírito Santo?</p>
        </div>
      </details>
    </article>
  </template>

  <template id="lesson-9">
    <article class="content-card">
      <div class="lesson-heading">
        <span class="badge">LIÇÃO 09 · PÁGINA 58</span>
        <h2>Os Dons do Espírito Santo</h2>
      </div>

      <div class="verse">
        <p>“Mas a manifestação do Espírito é dada a cada um para o que for útil.”</p>
        <span>1 Coríntios 12.7</span>
      </div>

      <div class="facts">
        <div class="fact"><strong>LEITURA BÍBLICA</strong><span>Romanos 12.4–8; 1 Coríntios 12.1, 4–11</span></div>
        <div class="fact"><strong>OBJETIVO</strong><span>Entender os dons, seus propósitos e como o Espírito os distribui.</span></div>
      </div>

      <details open>
        <summary>Objetivos da lição</summary>
        <div class="detail-body">
          <ul>
            <li>Explicar o significado e o propósito dos dons.</li>
            <li>Diferenciar dons ministeriais de dons espirituais.</li>
            <li>Entender como o Espírito Santo distribui os dons.</li>
          </ul>
        </div>
      </details>

      <details>
        <summary>Conteúdo da aula</summary>
        <div class="detail-body">
          <h3>1. Significado e propósito dos dons</h3>
          <p>“Dom” significa presente ou dádiva. A lição apresenta os dons espirituais como dádivas de Deus concedidas à Igreja para sua edificação. Eles não são recebidos por merecimento: o Espírito os concede como quer.</p>
          <p>Entre os propósitos dos dons estão glorificar Jesus, confirmar a Palavra de Deus e edificar os crentes e a Igreja (1 Coríntios 14.12; Marcos 16.15–20).</p>

          <h3>2. Dons ministeriais</h3>
          <p>Em Romanos 12.4–8, Paulo compara a Igreja a um corpo com muitos membros. Cada pessoa tem importância e pode contribuir com zelo e amor.</p>
          <ul>
            <li><strong>Profecia:</strong> transmitir uma palavra exige fé e responsabilidade.</li>
            <li><strong>Ministério ou serviço:</strong> prestar assistência prática e ajudar no trabalho da Igreja.</li>
            <li><strong>Ensino:</strong> compartilhar o conhecimento com dedicação e responsabilidade.</li>
            <li><strong>Exortação:</strong> consolar, encorajar e fortalecer outras pessoas.</li>
            <li><strong>Assistência e misericórdia:</strong> ajudar quem precisa com compaixão, liberalidade e alegria.</li>
            <li><strong>Administração:</strong> conduzir responsabilidades com cuidado e respeitar a organização da Igreja.</li>
          </ul>

          <h3>3. Dons espirituais</h3>
          <p>A lição organiza os dons de 1 Coríntios 12.7–11 em três grupos: revelação, locução e poder.</p>

          <h3>Dons de revelação</h3>
          <ul>
            <li><strong>Palavra de sabedoria:</strong> orientação para agir e falar em situações desafiadoras.</li>
            <li><strong>Palavra da ciência:</strong> conhecimento relacionado a Deus, ao Evangelho e à vida cristã.</li>
            <li><strong>Discernimento de espíritos:</strong> discernir manifestações e ensinamentos, especialmente diante de falsos profetas.</li>
          </ul>

          <h3>Dons de locução</h3>
          <ul>
            <li><strong>Variedade de línguas:</strong> manifestação dada pelo Espírito. A lição diferencia esse dom das línguas associadas ao batismo no Espírito Santo.</li>
            <li><strong>Interpretação de línguas:</strong> torna compreensível à Igreja uma mensagem em línguas.</li>
            <li><strong>Profecia:</strong> mensagem para a Igreja, cujo conteúdo deve ser examinado à luz das Escrituras.</li>
          </ul>

          <h3>Dons de poder</h3>
          <ul>
            <li><strong>Fé:</strong> capacitação do Espírito para situações além da esfera natural, visando à edificação da Igreja.</li>
            <li><strong>Dons de curar:</strong> podem trazer alívio a quem sofre enfermidades e glorificar a Deus.</li>
            <li><strong>Operação de maravilhas:</strong> atos extraordinários atribuídos à atuação de Deus.</li>
          </ul>

          <h3>O uso responsável dos dons</h3>
          <p>A lição usa a imagem de um despenseiro, responsável por cuidar e distribuir recursos. Os dons devem ser administrados com cuidado para servir à Igreja, edificar a comunidade e glorificar a Deus (1 Pedro 4.10–11).</p>

          <div class="highlight">
            <strong>Para guardar:</strong> os dons são diferentes, mas vêm do mesmo Espírito. Seu propósito é servir, edificar a Igreja e ajudar no cumprimento de sua missão.
          </div>
        </div>
      </details>

      <details>
        <summary>Referências para estudo</summary>
        <div class="detail-body">
          <ul>
            <li>Romanos 12.4–8 — diferentes funções no corpo da Igreja.</li>
            <li>1 Coríntios 12.1–11 — diversidade e distribuição dos dons.</li>
            <li>1 Coríntios 14.12, 29, 39 — edificação, avaliação e busca dos dons.</li>
            <li>Atos 6.2–3 e Efésios 4.11 — serviço e ensino.</li>
            <li>1 Pedro 4.10–11 — administrar os dons para servir e glorificar a Deus.</li>
          </ul>
        </div>
      </details>

      <details>
        <summary>Para conversar em grupo</summary>
        <div class="detail-body">
          <p>A lição compara a Igreja a um corpo formado por diferentes membros. Conversem sobre como pessoas com dons e funções diferentes podem cooperar e edificar umas às outras.</p>
        </div>
      </details>

      <details>
        <summary>Conclusão</summary>
        <div class="detail-body">
          <p>Os dons do Espírito Santo são recursos para a Igreja cumprir sua missão. A lição incentiva a reconhecê-los e buscá-los para a edificação e o crescimento espiritual. Os dons não salvam; ajudam a Igreja a anunciar a salvação em Jesus Cristo.</p>
        </div>
      </details>

      <details>
        <summary>Hora da revisão · perguntas sem respostas</summary>
        <div class="detail-body">
          <p class="question"><span class="q-number">1</span>Para fins didáticos, em relação aos dons espirituais, qual divisão é abordada nesta lição?</p>
          <p class="question"><span class="q-number">2</span>Releia 1 Coríntios 12.1–11 e cite nominalmente os nove dons presentes no texto.</p>
          <p class="question"><span class="q-number">3</span>Quais dons são considerados dons de revelação?</p>
          <p class="question"><span class="q-number">4</span>Quais dons são considerados dons de poder?</p>
          <p class="question"><span class="q-number">5</span>Quais dons são considerados dons de locução?</p>
        </div>
      </details>
    </article>
  </template>

  <script>
    const lessons = [
      { number: 1, title: "A Natureza do Espírito Santo", page: 5 },
      { number: 2, title: "Os Nomes do Espírito Santo", page: 12 },
      { number: 3, title: "Os Símbolos do Espírito Santo", page: 19 },
      { number: 4, title: "O Espírito Santo no Antigo Testamento", page: 25 },
      { number: 5, title: "O Espírito Santo no Novo Testamento", page: 31 },
      { number: 6, title: "O Espírito Atuante em Cristo", page: 37 },
      { number: 7, title: "O Espírito Santo Atuando no Crente", page: 44 },
      { number: 8, title: "O Batismo no Espírito Santo", page: 51 },
      { number: 9, title: "Os Dons do Espírito Santo", page: 58 },
      { number: 10, title: "Conservando o Poder", page: 65 },
      { number: 11, title: "O Fruto do Espírito Santo", page: 72 },
      { number: 12, title: "Pecando Contra o Espírito Santo", page: 79 },
      { number: 13, title: "Busque o Batismo no Espírito Santo", page: 86 }
    ];

    const list = document.getElementById("lesson-list");
    const content = document.getElementById("lesson-content");

    function selectLesson(number) {
      const lesson = lessons.find(item => item.number === number);

      document.querySelectorAll(".lesson-button").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.number) === number);
        button.setAttribute("aria-current",
          Number(button.dataset.number) === number ? "true" : "false");
      });

      if (number === 8 || number === 9) {
        const template = document.getElementById(`lesson-${number}`);
        content.innerHTML = "";
        content.appendChild(template.content.cloneNode(true));
      } else {
        content.innerHTML = `
          <article class="content-card">
            <div class="lesson-heading">
              <span class="badge">LIÇÃO ${String(number).padStart(2, "0")}</span>
              <h2>${lesson.title}</h2>
            </div>
            <div class="pending">
              Página ${lesson.page} do índice. O material desta lição ainda não foi enviado.
            </div>
          </article>`;
      }
    }

    lessons.forEach(lesson => {
      const available = lesson.number === 8 || lesson.number === 9;
      const item = document.createElement("li");
      const button = document.createElement("button");

      button.type = "button";
      button.className = "lesson-button";
      button.dataset.number = lesson.number;
      button.innerHTML = `
        <span class="lesson-number">${String(lesson.number).padStart(2, "0")}</span>
        <span class="lesson-name">
          ${lesson.title}
          <span class="lesson-meta">Página ${lesson.page}</span>
        </span>
        <span class="status">${available ? "ABRIR" : "EM BREVE"}</span>`;

      button.addEventListener("click", () => selectLesson(lesson.number));
      item.appendChild(button);
      list.appendChild(item);
    });

    selectLesson(8);
  </script>
</body>
</html>
